name: si-e2e

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ${E2E_PREFIX:-si-e2e}-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ${E2E_PREFIX:-si-e2e}-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_MS: 3600000
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 40s

  mysql:
    image: mysql:8.0.32
    container_name: ${E2E_PREFIX:-si-e2e}-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: si_test_db
      MYSQL_USER: sitest
      MYSQL_PASSWORD: sitest123
    ports:
      - "3307:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
      --authentication-policy=mysql_native_password,,
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --binlog-format=ROW
      --log-bin=mysql-bin
      --server-id=1
      --skip-ssl
      --max-connections=500
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usitest", "-psitest123"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
